<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | ShopNow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/"><span>Shop</span>Now</a>
  <div class="nav-right">
    <a class="nav-link" href="/login" id="nav-account"><span>Hello, Sign in</span><span>Account & Lists</span></a>
    <a class="nav-link" href="/orders"><span>Returns &</span><span>Orders</span></a>
    <a class="nav-cart" href="/cart">🛒 Cart <span class="cart-count" id="cart-count" style="display:none">0</span></a>
  </div>
</nav>

<div class="container" style="padding-top:24px;padding-bottom:40px">
  <h1 style="font-size:28px;font-weight:700;margin-bottom:20px">Shopping Cart</h1>

  <div id="cart-container">
    <div class="cart-layout">
      <div class="cart-box">
        <div id="cart-items-list"></div>
      </div>
      <div id="cart-summary" style="display:none">
        <div class="cart-box order-summary">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:12px">Order Summary</h3>
          <div class="summary-row"><span>Items (<span id="item-count">0</span>)</span><span id="summary-subtotal">$0.00</span></div>
          <div class="summary-row"><span>Shipping</span><span id="summary-shipping">—</span></div>
          <div class="summary-row"><span>Estimated Tax</span><span id="summary-tax">$0.00</span></div>
          <div class="summary-row summary-total"><strong>Order Total</strong><strong id="summary-total">$0.00</strong></div>
          <button class="btn-checkout" id="checkout-btn">Proceed to Checkout</button>
          <p style="font-size:12px;color:var(--gray-400);text-align:center;margin-top:8px">Free shipping on orders over $25</p>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to top</div>
  <div class="footer-bottom"><div class="footer-logo"><span>Shop</span>Now</div><p style="margin-top:8px">© 2024 ShopNow, Inc.</p></div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
