<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ShopNow</title>
  <meta name="description" content="Sign in to your ShopNow account or create a new one.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/"><span>Shop</span>Now</a>
</nav>

<div class="auth-page">
  <div>
    <div class="auth-box">
      <div class="auth-logo"><span>Shop</span>Now</div>
      <p style="text-align:center;color:var(--gray-600);font-size:13px;margin-bottom:20px">Your one-stop shop for everything</p>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Sign In</button>
        <button class="auth-tab" id="tab-register">Create Account</button>
      </div>

      <!-- Login Form -->
      <div id="login-form">
        <div class="auth-error" id="login-error"></div>
        <div class="form-group">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn-auth" id="login-btn" type="button">Sign In</button>
        <p style="text-align:center;font-size:12px;color:var(--gray-400);margin-top:16px">By signing in, you agree to ShopNow's Conditions of Use.</p>
      </div>

      <!-- Register Form -->
      <div id="register-form" style="display:none">
        <div class="auth-error" id="register-error"></div>
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email address</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password (min. 6 characters)</label>
          <input type="password" id="reg-password" placeholder="••••••••" required minlength="6">
        </div>
        <button class="btn-auth" id="register-btn" type="button">Create Account</button>
        <p style="text-align:center;font-size:12px;color:var(--gray-400);margin-top:16px">By creating an account, you agree to ShopNow's Conditions of Use.</p>
      </div>
    </div>

    <div style="text-align:center;margin-top:24px;color:var(--gray-400);font-size:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <div style="flex:1;height:1px;background:var(--gray-200)"></div>
        <span>New to ShopNow?</span>
        <div style="flex:1;height:1px;background:var(--gray-200)"></div>
      </div>
      <button onclick="document.getElementById('tab-register').click()" style="width:100%;max-width:400px;padding:10px;border:1px solid var(--gray-200);border-radius:8px;background:white;font-size:13px;cursor:pointer;transition:all 0.2s" onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background='white'">
        Create your ShopNow account
      </button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
