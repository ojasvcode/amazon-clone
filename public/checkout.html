<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | ShopNow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/"><span>Shop</span>Now</a>
  <div style="color:white;font-size:14px;margin-left:auto;padding-right:16px">🔒 Secure Checkout</div>
</nav>

<div class="container" style="padding-top:32px;padding-bottom:60px">
  <h1 style="font-size:26px;font-weight:700;margin-bottom:24px">Checkout</h1>
  <div class="checkout-layout">

    <!-- Left: Form -->
    <div>
      <div class="cart-box" style="margin-bottom:20px">
        <h3 style="font-size:17px;font-weight:700;margin-bottom:20px">📦 Shipping Address</h3>
        <form id="checkout-form">
          <div class="form-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" placeholder="123 Main Street, Apt 4B" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" placeholder="New York" required>
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" placeholder="NY" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="zip">ZIP Code</label>
              <input type="text" id="zip" placeholder="10001" required>
            </div>
            <div class="form-group">
              <label for="country">Country</label>
              <input type="text" id="country" value="United States" required>
            </div>
          </div>
        </form>
      </div>

      <div class="cart-box">
        <h3 style="font-size:17px;font-weight:700;margin-bottom:20px">💳 Payment Method</h3>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px"><input type="radio" name="payment" value="card" checked> 💳 Credit/Debit Card</label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px"><input type="radio" name="payment" value="cod"> 💵 Cash on Delivery</label>
        </div>
        <div class="form-row">
          <div class="form-group" style="grid-column:1/-1">
            <label>Card Number</label>
            <input type="text" placeholder="4242 4242 4242 4242" maxlength="19">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Expiry</label>
            <input type="text" placeholder="MM / YY" maxlength="7">
          </div>
          <div class="form-group">
            <label>CVV</label>
            <input type="text" placeholder="•••" maxlength="4">
          </div>
        </div>
        <div style="background:var(--orange-light);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--navy);margin-top:4px">
          🔒 This is a demo — no real payment is processed.
        </div>
      </div>
    </div>

    <!-- Right: Summary -->
    <div class="order-summary">
      <div class="cart-box">
        <h3 style="font-size:17px;font-weight:700;margin-bottom:16px">Order Summary</h3>
        <div id="order-items" style="max-height:320px;overflow-y:auto"></div>
        <div style="border-top:1px solid var(--gray-100);margin-top:12px;padding-top:12px">
          <div class="summary-row"><span>Subtotal</span><span id="checkout-subtotal">—</span></div>
          <div class="summary-row"><span>Shipping</span><span id="checkout-shipping">—</span></div>
          <div class="summary-row"><span>Tax (8%)</span><span id="checkout-tax">—</span></div>
          <div class="summary-row summary-total"><strong>Total</strong><strong id="checkout-total">—</strong></div>
        </div>
        <button class="btn-checkout" id="place-order-btn" onclick="document.getElementById('checkout-form').dispatchEvent(new Event('submit'))">Place Order</button>
        <p style="font-size:12px;color:var(--gray-400);text-align:center;margin-top:8px">By placing your order, you agree to our terms.</p>
      </div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
