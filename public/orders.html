<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Orders | ShopNow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/"><span>Shop</span>Now</a>
  <div class="nav-search">
    <input type="text" id="nav-search-input" placeholder="Search products...">
    <button id="nav-search-btn">🔍</button>
  </div>
  <div class="nav-right">
    <a class="nav-link" href="/login" id="nav-account"><span>Hello, Sign in</span><span>Account & Lists</span></a>
    <a class="nav-link" href="/orders" style="color:var(--orange)"><span>Returns &</span><span>Orders</span></a>
    <a class="nav-cart" href="/cart">🛒 Cart <span class="cart-count" id="cart-count" style="display:none">0</span></a>
  </div>
</nav>

<div class="container" style="padding-top:24px;padding-bottom:60px">
  <h1 style="font-size:26px;font-weight:700;margin-bottom:24px">Your Orders</h1>
  <div id="orders-container">
    <!-- Skeleton -->
    <div class="order-card"><div class="skeleton skeleton-text" style="height:24px;width:30%;margin-bottom:16px"></div><div class="skeleton skeleton-text"></div></div>
    <div class="order-card"><div class="skeleton skeleton-text" style="height:24px;width:30%;margin-bottom:16px"></div><div class="skeleton skeleton-text"></div></div>
  </div>
</div>

<footer>
  <div class="footer-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to top</div>
  <div class="footer-bottom"><div class="footer-logo"><span>Shop</span>Now</div><p style="margin-top:8px">© 2024 ShopNow, Inc.</p></div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/orders.js"></script>
<script>
  document.getElementById('nav-search-btn').onclick = () => {
    const q = document.getElementById('nav-search-input').value.trim();
    if (q) location.href = `/search?q=${encodeURIComponent(q)}`;
  };
  document.getElementById('nav-search-input').onkeypress = e => { if (e.key === 'Enter') document.getElementById('nav-search-btn').click(); };
</script>
</body>
</html>
