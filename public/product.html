<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | ShopNow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="nav-logo" href="/"><span>Shop</span>Now</a>
  <div class="nav-search">
    <input type="text" id="nav-search-input" placeholder="Search products...">
    <button id="nav-search-btn">🔍</button>
  </div>
  <div class="nav-right">
    <a class="nav-link" href="/login" id="nav-account"><span>Hello, Sign in</span><span>Account & Lists</span></a>
    <a class="nav-link" href="/orders"><span>Returns &</span><span>Orders</span></a>
    <a class="nav-cart" href="/cart">🛒 Cart <span class="cart-count" id="cart-count" style="display:none">0</span></a>
  </div>
</nav>
<div class="nav-sub">
  <a href="/">Home</a>
  <a href="/search?category=electronics">Electronics</a>
  <a href="/search?category=books">Books</a>
  <a href="/search?category=clothing">Fashion</a>
  <a href="/search?category=home-kitchen">Home & Kitchen</a>
</div>

<div class="container" style="padding-top:24px;padding-bottom:40px">
  <div id="product-container">
    <div class="product-detail">
      <div class="product-detail-grid">
        <div class="skeleton skeleton-img" style="height:400px;border-radius:12px"></div>
        <div>
          <div class="skeleton skeleton-text" style="height:30px;margin-bottom:16px"></div>
          <div class="skeleton skeleton-text" style="width:60%;margin-bottom:12px"></div>
          <div class="skeleton skeleton-price" style="height:40px;width:30%;margin-bottom:20px"></div>
          <div class="skeleton skeleton-text" style="margin-bottom:8px"></div>
          <div class="skeleton skeleton-text" style="margin-bottom:8px"></div>
          <div class="skeleton skeleton-text" style="width:80%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to top</div>
  <div class="footer-bottom"><div class="footer-logo"><span>Shop</span>Now</div><p style="margin-top:8px">© 2024 ShopNow, Inc.</p></div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/product.js"></script>
<script>
  document.getElementById('nav-search-btn').onclick = () => {
    const q = document.getElementById('nav-search-input').value.trim();
    if (q) location.href = `/search?q=${encodeURIComponent(q)}`;
  };
  document.getElementById('nav-search-input').onkeypress = e => { if (e.key === 'Enter') document.getElementById('nav-search-btn').click(); };
</script>
</body>
</html>
